name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # v3 fails on current runners: its default package list still asks for the retired
      # "tools" package (Failed to find package 'tools').
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      # Set repo variable MESA_LIBS_URL (Settings > Variables) to your arm64 Zink/Kopper build.
      # Skipped when the variable is unset: the plugin then uses the launcher's own Mesa.
      - name: Fetch Mesa libs
        if: ${{ vars.MESA_LIBS_URL != '' }}
        env:
          MESA_LIBS_URL: ${{ vars.MESA_LIBS_URL }}
        run: bash scripts/fetch_mesa_libs.sh

      # Optional experimental RADV loader (set repo variable WITH_ADRENOTOOLS=1)
      - name: Fetch libadrenotools
        if: ${{ vars.WITH_ADRENOTOOLS == '1' }}
        run: git clone --recursive https://github.com/bylaws/libadrenotools.git third_party/libadrenotools

      - name: Build
        run: |
          EXTRA=""
          if [ "${{ vars.WITH_ADRENOTOOLS }}" = "1" ]; then
            EXTRA="-Pxclipse.adrenotools=$PWD/third_party/libadrenotools"
          fi
          gradle assembleDebug $EXTRA

      # The renderer metadata names the GL/EGL libraries the launcher will load from the APK's
      # nativeLibraryDir. Shipping an APK whose declared library is missing makes the game die with
      # "Failed to dynamically load library ... libglxshim.so" - fail the build instead.
      - name: Verify packaged plugin libraries
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          echo "APK: $apk"
          list=$(unzip -l "$apk")
          echo "$list" | grep 'lib/arm64-v8a/'
          for lib in libglxshim.so libEGL_xclipse.so libxclipse_shim.so; do
            if ! grep -q "lib/arm64-v8a/$lib" <<<"$list"; then
              echo "::error::lib/arm64-v8a/$lib is declared by the plugin manifest but missing from the APK"
              exit 1
            fi
          done
          for lib in libEGL_mesa.so libzink_dri.so; do
            if grep -q "lib/arm64-v8a/$lib" <<<"$list"; then
              echo "bundled: $lib"
            else
              echo "::warning::$lib is not bundled; libEGL_xclipse.so will use the launcher's own Mesa (resolved by name via LD_LIBRARY_PATH)"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XclipseRDNA-debug
          path: app/build/outputs/apk/debug/*.apk
